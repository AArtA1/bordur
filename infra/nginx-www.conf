# www.бордюры-мск.рф — не самостоятельный сайт, а псевдоним основного домена.
# Ставится в /etc/nginx/sites-available/bordur-www скриптом deploy.sh.
#
# Редирект стоит внутри location, а не серверным `if`: серверный `if` срабатывает
# в фазе rewrite, то есть раньше выбора location, и перехватывал бы в том числе
# запросы Let's Encrypt на /.well-known/ — сертификат для www стало бы не выпустить.

server {
    listen 80;
    listen [::]:80;
    server_name www.xn----9sbjzjjobl1h5a.xn--p1ai;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://xn----9sbjzjjobl1h5a.xn--p1ai$request_uri;
    }
}
