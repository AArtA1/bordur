# Производительность nginx: сжатие и политика кеширования.
# Ставится в /etc/nginx/conf.d/bordur-perf.conf скриптом deploy.sh.
#
# Отдельный файл, а не правка вхоста, потому что /etc/nginx/sites-available/bordur
# редактирует certbot — при перевыпуске сертификата наши правки бы потерялись.

# --- Сжатие ---
# Само `gzip on` уже стоит в /etc/nginx/nginx.conf — повторять нельзя, nginx
# считает это дублем директивы и падает на проверке конфига. Здесь только то,
# что в дистрибутивном конфиге закомментировано.
gzip_vary on;
gzip_min_length 512;
gzip_comp_level 5;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml;

# --- Кеширование ---
# Имена файлов не версионируются (нет хешей в названиях), поэтому:
#   HTML, CSS, JS  — всегда перепроверять на сервере. Ответ 304 стоит один RTT,
#                    зато после деплоя никто не залипнет на старой версии.
#   картинки, видео, шрифты — неделя. Если картинку заменят под тем же именем,
#                    обновление у постоянных посетителей займёт до 7 дней.
map $sent_http_content_type $bordur_cache_control {
    default                     "no-cache";
    ~*^text/html                "no-cache";
    ~*^text/css                 "no-cache";
    ~*javascript                "no-cache";
    ~*^image/                   "public, max-age=604800";
    ~*^video/                   "public, max-age=604800";
    ~*^font/                    "public, max-age=604800";
    ~*^application/font         "public, max-age=604800";
}

add_header Cache-Control $bordur_cache_control always;
