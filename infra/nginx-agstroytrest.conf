# Второй домен — agstroytrest.ru. Тот же сайт из того же вебрута.
# Ставится в /etc/nginx/sites-available/bordur-agstroytrest скриптом deploy.sh.
#
# Отдельным server-блоком, а не добавлением имён в основной вхост, потому что у
# домена свой сертификат: один блок обслуживается одним сертификатом, и certbot
# дописывает секцию 443 именно в тот файл, где нашёл имя.
#
# Здесь сайт отдаётся как есть, без редиректа на основной домен. Обратная сторона:
# для поисковиков это две копии одного сайта. Если понадобится назначить главным
# один адрес — замените содержимое location / на
#   return 301 https://xn----9sbjzjjobl1h5a.xn--p1ai$request_uri;
# либо наоборот, сделайте основным этот домен, а .рф — псевдонимом.

server {
    listen 80;
    listen [::]:80;
    server_name agstroytrest.ru www.agstroytrest.ru;

    root /var/www/html;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(md|sh|py|docx?)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
