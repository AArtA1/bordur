# www — не самостоятельный сайт, а псевдоним: уводим на основной домен.
# Редирект стоит внутри location, а не серверным `if`: серверный `if` сработал бы
# в фазе rewrite, то есть раньше выбора location, и перехватывал бы в том числе
# запросы Let's Encrypt на /.well-known/ — сертификат для www стало бы не выпустить.
server {
    listen 80;
    listen [::]:80;
    server_name www.xn----9sbjzjjobl1h5a.xn--p1ai;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://xn----9sbjzjjobl1h5a.xn--p1ai$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name xn----9sbjzjjobl1h5a.xn--p1ai;

    root /var/www/html;
    index index.html;

    # Проверка домена от Let's Encrypt — должна идти до запрета скрытых файлов
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        allow all;
    }

    # Скрытые файлы (.git, .env и подобное) наружу не отдаём
    location ~ /\. {
        deny all;
    }

    # Исходники и документация, если вдруг попадут в вебрут
    location ~* \.(md|sh|py|docx?)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
