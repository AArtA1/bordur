server {
    listen 80;
    listen [::]:80;
    server_name xn----9sbjzjjobl1h5a.xn--p1ai;

    root /var/www/html;
    index index.html;

    # Проверка домена от Let's Encrypt — должна идти до запрета скрытых файлов
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        allow all;
    }

    # Скрытые файлы (.git, .env и подобное) наружу не отдаём
    location ~ /\. {
        deny all;
    }

    # Исходники и документация, если вдруг попадут в вебрут
    location ~* \.(md|sh|py|docx?)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
