name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -eu

            REPO=https://github.com/AArtA1/bordur.git
            SRC=/root/bordur
            WEBROOT=/var/www/html

            command -v rsync >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq rsync; }

            # Репозиторий может отсутствовать (переустановка образа) — тогда клонируем
            if [ -d "$SRC/.git" ]; then
              git -C "$SRC" fetch --prune origin main
              git -C "$SRC" reset --hard origin/main
              git -C "$SRC" clean -fd
            else
              rm -rf "$SRC"
              git clone --branch main "$REPO" "$SRC"
            fi

            # Страховка: не синхронизировать пустое или битое дерево поверх живого сайта
            test -s "$SRC/index.html"

            mkdir -p "$WEBROOT"
            rsync -a --delete --exclude-from="$SRC/.rsync-exclude" "$SRC"/ "$WEBROOT"/

            nginx -t
            systemctl reload nginx

            echo "Deployed $(git -C "$SRC" rev-parse --short HEAD)"
